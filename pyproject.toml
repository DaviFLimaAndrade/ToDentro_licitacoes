[project]
name = "radar-licitacoes"
version = "0.1.0"
description = "Encontra licitações abertas no PNCP e diz se valem a pena para uma pequena empresa."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.3,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
    "pypdf>=5.0",
    "pypdfium2>=4.30",
]

[project.optional-dependencies]
agents = [
    "groq>=0.11",
    "google-genai>=1.0",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
tracing = [
    "arize-phoenix>=8.0",
    "arize-phoenix-otel>=0.6",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
